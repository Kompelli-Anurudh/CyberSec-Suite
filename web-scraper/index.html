<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper - Cyber Tool Kit</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Web Scraper</div>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="https://github.com/Kompelli-Anurudh/cyber-tool-kit" target="_blank">GitHub</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="tool-section">
            <h2>Website Scraper</h2>
            <div class="tool-container">
                <div class="input-group">
                    <input type="url" id="website-url" placeholder="Enter website URL (e.g., https://example.com)">
                    <button id="start-scraping" onclick="startScraping()">Start Scraping</button>
                    <button id="stop-scraping" onclick="stopScraping()" disabled>Stop</button>
                </div>

                <div class="status-container">
                    <p id="status-text">Ready</p>
                    <div class="progress-bar">
                        <div id="progress-indicator"></div>
                    </div>
                </div>

                <div class="results-container">
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="text">Text Content</button>
                        <button class="tab-btn" data-tab="links">Links</button>
                        <button class="tab-btn" data-tab="images">Images</button>
                        <button class="tab-btn" data-tab="forms">Forms</button>
                        <button class="tab-btn" data-tab="tables">Tables</button>
                        <button class="tab-btn" data-tab="emails">Emails</button>
                    </div>

                    <div class="tab-content">
                        <div id="text" class="tab-pane active">
                            <div class="content-area"></div>
                        </div>
                        <div id="links" class="tab-pane">
                            <div class="content-area"></div>
                        </div>
                        <div id="images" class="tab-pane">
                            <div class="content-area image-grid"></div>
                        </div>
                        <div id="forms" class="tab-pane">
                            <div class="content-area"></div>
                        </div>
                        <div id="tables" class="tab-pane">
                            <div class="content-area"></div>
                        </div>
                        <div id="emails" class="tab-pane">
                            <div class="content-area"></div>
                        </div>
                    </div>
                </div>

                <div class="log-container">
                    <h3>Log</h3>
                    <div id="log-area"></div>
                </div>

                <div class="export-container">
                    <button id="export-json" onclick="exportResults('json')" disabled>Export as JSON</button>
                    <button id="export-txt" onclick="exportResults('txt')" disabled>Export as TXT</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Cyber Tool Kit. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
